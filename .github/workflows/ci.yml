name: CI

on:
  push:
    branches: [main, developement, Experimental]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "patchpilot-brand/**"
      - "LICENSE"
  pull_request:
    branches: [main, developement]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "patchpilot-brand/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      TESTING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12 with cache
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies & run verification suite
        run: |
          uv sync --dev --frozen
          uv run python -m compileall -q app tests examples
          uv run python examples/quickstart/demo_review.py
          uv run pytest -q
