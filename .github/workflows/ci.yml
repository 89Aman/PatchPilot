name: CI

on:
  push:
    branches: [main, developement, Experimental]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "patchpilot-brand/**"
      - "LICENSE"
  pull_request:
    branches: [main, developement]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "patchpilot-brand/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      TESTING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv with cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies & run tests
        run: |
          uv sync --dev --frozen --no-install-project
          .venv/bin/pytest -q --disable-warnings
